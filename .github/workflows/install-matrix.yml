name: Install matrix

# v1.37.0 비용 절감:
# - 13 jobs → 2 jobs (static-lints + install-scenarios)
# - main push 트리거 제거 (PR 에서 이미 검증, 중복 실행 차단)
# - concurrency 그룹으로 같은 PR 새 push 시 이전 job cancel

on:
  pull_request:
    paths:
      - bootstrap.sh
      - .claude/**
      - .claude-plugin/**
      - .github/workflows/install-matrix.yml

concurrency:
  group: install-matrix-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static-lints:
    name: Static lints (CLAUDE.md cap · agent desc · plugin meta · settings · template cap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: All CLAUDE.md ≤ 300 lines
        run: |
          set -euo pipefail
          FAIL=0
          while IFS= read -r f; do
            LINES=$(wc -l < "$f" | tr -d ' ')
            if [ "$LINES" -gt 300 ]; then
              echo "❌ $f: $LINES > 300"
              FAIL=1
            fi
          done < <(find . -name 'CLAUDE.md' -o -name 'CLAUDE.*.md' | grep -v node_modules | grep -v .worktrees)
          [ "$FAIL" = "0" ]

      - name: Stack templates — CLAUDE.{stack}.md ≤ 120 lines
        run: |
          set -euo pipefail
          MAX=120; FAIL=0
          for f in .claude/templates/CLAUDE.*.md; do
            LINES=$(wc -l < "$f" | tr -d ' ')
            if [ "$LINES" -gt "$MAX" ]; then
              echo "❌ $f: $LINES > $MAX"
              echo "   → 사용자 매 세션 토큰. 상세는 .claude/skills/ 로."
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ]

      - name: Agent description — single-line + length ≤ 250
        run: |
          set -euo pipefail
          MAX=250; FAIL=0
          for f in .claude/agents/*.md; do
            FM=$(awk '/^---$/{c++; if(c==1){next} if(c==2){exit}} c==1' "$f")
            DESC_LINE=$(echo "$FM" | grep -E '^description:' || echo "")
            if [ -z "$DESC_LINE" ]; then
              echo "❌ $f: description missing"; FAIL=1; continue
            fi
            if echo "$DESC_LINE" | grep -qE '^description:[[:space:]]*[|>][[:space:]]*$'; then
              echo "❌ $f: multi-line YAML scalar (Agent schema 는 single-line string 권장)"
              FAIL=1; continue
            fi
            DESC=$(echo "$DESC_LINE" | sed 's/^description:[[:space:]]*//')
            LEN=${#DESC}
            [ "$LEN" -gt "$MAX" ] && { echo "❌ $f: $LEN > $MAX"; FAIL=1; }
          done
          [ "$FAIL" = "0" ]

      - name: .claude-plugin meta — JSON + required fields + version sync
        run: |
          set -euo pipefail
          MARKETPLACE=.claude-plugin/marketplace.json
          PLUGIN=.claude-plugin/plugin.json
          [ -f "$MARKETPLACE" ] || { echo "ℹ️ no marketplace.json — skip"; exit 0; }

          jq -e . "$MARKETPLACE" >/dev/null
          [ -f "$PLUGIN" ] && jq -e . "$PLUGIN" >/dev/null

          # marketplace 필수 필드
          jq -e '.name | type == "string" and length > 0' "$MARKETPLACE" >/dev/null
          jq -e '.owner.name | type == "string" and length > 0' "$MARKETPLACE" >/dev/null
          jq -e '.plugins | type == "array" and length > 0' "$MARKETPLACE" >/dev/null

          # name kebab-case + 예약 이름 차단
          NAME=$(jq -r '.name' "$MARKETPLACE")
          [[ "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "❌ marketplace name '$NAME' must be kebab-case"; exit 1; }
          for reserved in claude-code-marketplace claude-code-plugins claude-plugins-official anthropic-marketplace anthropic-plugins agent-skills knowledge-work-plugins life-sciences; do
            [ "$NAME" = "$reserved" ] && { echo "❌ '$NAME' is Anthropic reserved"; exit 1; }
          done
          jq -e '.plugins[] | (.name | type == "string") and (.source != null)' "$MARKETPLACE" >/dev/null

          # plugin.json
          if [ -f "$PLUGIN" ]; then
            jq -e '.name | type == "string" and length > 0' "$PLUGIN" >/dev/null
            jq -e '.description | type == "string"' "$PLUGIN" >/dev/null
            jq -e '.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+")' "$PLUGIN" >/dev/null
            PV=$(jq -r '.version' "$PLUGIN")
            FV=$(cat VERSION | tr -d '[:space:]')
            [ "$PV" = "$FV" ] || { echo "❌ plugin.json version=$PV out of sync with VERSION=$FV"; exit 1; }
          fi

      - name: settings.{stack}.json — common base (plugins / allow / deny)
        run: |
          set -euo pipefail
          REQ_P='["claude-md-management@claude-plugins-official","commit-commands@claude-plugins-official","github@claude-plugins-official","hookify@claude-plugins-official"]'
          REQ_A='["Bash(cp *)","Bash(git *)","Bash(mkdir *)","Bash(mv *)","Bash(touch *)"]'
          REQ_D='["Bash(git push --force *)","Bash(git push -f *)","Bash(rm -rf /)","Bash(rm -rf ~*)"]'
          FAIL=0
          for f in .claude/templates/settings.*.json; do
            STACK=$(basename "$f" .json | sed 's/^settings\.//')
            MP=$(jq --argjson req "$REQ_P" '$req - (.enabledPlugins // {} | keys)' "$f")
            MA=$(jq --argjson req "$REQ_A" '$req - (.permissions.allow // [])' "$f")
            MD=$(jq --argjson req "$REQ_D" '$req - (.permissions.deny // [])' "$f")
            [ "$(echo "$MP" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: missing plugins: $(echo $MP|jq -c .)"; FAIL=1; }
            [ "$(echo "$MA" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: missing allow: $(echo $MA|jq -c .)"; FAIL=1; }
            [ "$(echo "$MD" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: missing deny: $(echo $MD|jq -c .)"; FAIL=1; }
          done
          [ "$FAIL" = "0" ]

      - name: settings.{stack}.json — required hooks contract
        run: |
          set -euo pipefail
          REQUIRED_ALL="session-start.sh safety-guard.sh usage-counter.sh"
          REQUIRED_CODE="pre-push.sh post-edit-lint.sh"
          NON_CODE_STACKS="marketing sales product"
          FAIL=0
          for f in .claude/templates/settings.*.json; do
            STACK=$(basename "$f" .json | sed 's/^settings\.//')
            HOOKS=$(jq -r '[.hooks // {}] | map(to_entries[]) | .[].value | map(.hooks[]?.command // empty) | .[]' "$f" 2>/dev/null | grep -oE '[a-z-]+\.sh' | sort -u | tr '\n' ' ')

            for required in $REQUIRED_ALL; do
              case " $HOOKS " in
                *" $required "*) ;;
                *) echo "❌ $STACK: missing hook (all): $required"; FAIL=1 ;;
              esac
            done

            IS_NON_CODE=false
            for nc in $NON_CODE_STACKS; do [ "$STACK" = "$nc" ] && IS_NON_CODE=true && break; done

            if [ "$IS_NON_CODE" = "false" ]; then
              for required in $REQUIRED_CODE; do
                case " $HOOKS " in
                  *" $required "*) ;;
                  *) echo "❌ $STACK: missing hook (code): $required"; FAIL=1 ;;
                esac
              done
            fi
          done
          [ "$FAIL" = "0" ]

  install-scenarios:
    name: Install scenarios (fresh · preserve · pin · rollback · empty-hooks · init-cleanup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fresh install (curl | bash)
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh"
          test -d .claude
          test -f .claude/.starter-version
          test -f .claude/settings.json
          test -d .claude/agents && [ "$(ls -A .claude/agents)" ]
          test -d .claude/commands && [ "$(ls -A .claude/commands)" ]
          test -d .claude/hooks && [ "$(ls -A .claude/hooks)" ]
          for h in .claude/hooks/*.sh; do bash -n "$h"; done

      - name: Update preserves custom assets
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh"
          mkdir -p .claude/agents/custom .claude/commands/custom .claude/hooks/custom .claude/skills/custom
          echo "ag" > .claude/agents/custom/a.md
          echo "cm" > .claude/commands/custom/c.md
          echo "hk" > .claude/hooks/custom/h.sh
          echo "sk" > .claude/skills/custom/s.md
          echo '{"local":1}' > .claude/settings.local.json
          bash "$GITHUB_WORKSPACE/bootstrap.sh"
          for f in agents/custom/a.md commands/custom/c.md hooks/custom/h.sh skills/custom/s.md settings.local.json; do
            test -f ".claude/$f" || { echo "❌ lost: $f"; exit 1; }
          done

      - name: Update with --no-preserve wipes custom
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh"
          mkdir -p .claude/agents/custom
          echo "x" > .claude/agents/custom/a.md
          bash "$GITHUB_WORKSPACE/bootstrap.sh" --no-preserve
          [ ! -f .claude/agents/custom/a.md ] || { echo "❌ --no-preserve left custom"; exit 1; }

      - name: Version pin (--version)
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs https://github.com/nogamsung/claude-code-starter.git | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -2 | head -1)
          [ -z "$TAG" ] && { echo "ℹ️ no prior tag — skip"; exit 0; }
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" --version "$TAG"
          [ "$(cat .claude/.starter-version)" = "${TAG#v}" ] || { echo "❌ pin failed"; exit 1; }

      - name: Update writes .starter-version-prev
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs https://github.com/nogamsung/claude-code-starter.git | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -z "$TAG" ] && exit 0
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" --version "$TAG"
          OLD=$(cat .claude/.starter-version)
          bash "$GITHUB_WORKSPACE/bootstrap.sh"
          [ "$(cat .claude/.starter-version-prev)" = "$OLD" ] || { echo "❌ prev mismatch"; exit 1; }

      - name: Hooks fail silently on empty project (no stacks.json)
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null
          bash .claude/hooks/session-start.sh > /dev/null
          echo '{"tool_input":{"file_path":"random.py"}}' | bash .claude/hooks/post-edit-lint.sh
          echo '{"tool_input":{"command":"ls"}}' | bash .claude/hooks/safety-guard.sh

      - name: init-cleanup.sh — 9 single-stack dry-run expected counts
        run: |
          set -euo pipefail
          declare -A EXPECT=(
            [kotlin]="18 10 29"
            [go]="19 10 29"
            [python]="15 8 29"
            [nextjs]="19 11 29"
            [flutter]="19 13 29"
            [infra]="22 11 29"
            [marketing]="23 16 27"
            [sales]="23 16 27"
            [product]="23 16 26"
          )
          FAIL=0
          for MODE in "${!EXPECT[@]}"; do
            TARGET=$(mktemp -d)
            (cd "$TARGET" && bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null)
            RESULT=$(cd "$TARGET" && bash "$GITHUB_WORKSPACE/.claude/scripts/init-cleanup.sh" "$MODE" 2>&1)
            A=$(echo "$RESULT" | grep "agents:" | head -1 | grep -oE '[0-9]+')
            S=$(echo "$RESULT" | grep "skills:" | head -1 | grep -oE '[0-9]+')
            T=$(echo "$RESULT" | grep "templates:" | head -1 | grep -oE '[0-9]+')
            EXPECTED="${EXPECT[$MODE]}"
            [ "$A $S $T" = "$EXPECTED" ] || { echo "❌ $MODE expected=[$EXPECTED] actual=[$A $S $T]"; FAIL=1; }
            rm -rf "$TARGET"
          done
          [ "$FAIL" = "0" ]

      - name: init-cleanup.sh — --apply + 4 custom 자산 보존
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null
          mkdir -p .claude/agents/custom .claude/skills/custom .claude/hooks/custom .claude/commands/custom
          echo "ag" > .claude/agents/custom/a.md
          echo "sk" > .claude/skills/custom/s.md
          echo "hk" > .claude/hooks/custom/h.sh
          echo "cm" > .claude/commands/custom/c.md
          bash "$GITHUB_WORKSPACE/.claude/scripts/init-cleanup.sh" kotlin --apply > /dev/null
          for f in agents/custom/a.md skills/custom/s.md hooks/custom/h.sh commands/custom/c.md; do
            [ -f ".claude/$f" ] || { echo "❌ LOST: $f"; exit 1; }
          done
          [ "$(ls .claude/agents/*.md | wc -l | tr -d ' ')" = "9" ]
          [ "$(ls .claude/skills/*.md | wc -l | tr -d ' ')" = "9" ]   # 8 + mcp-presets (v1.38.0)

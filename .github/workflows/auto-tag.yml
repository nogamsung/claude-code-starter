name: Auto Tag on VERSION change

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION + SemVer 검증
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')

          # SemVer 형식 강제: X.Y.Z 또는 X.Y.Z-{rc|beta|alpha}.N
          # 잘못된 형식 (빈 값 / "dev" / "1.2" 등) 차단해 이상한 태그·릴리스 안 만들어짐
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "❌ VERSION='$VERSION' 형식 오류 — 'X.Y.Z' 또는 'X.Y.Z-rc.N' 만 허용"
            echo "    잘못된 태그가 GitHub Release · 패키지에 등록되지 않도록 차단."
            exit 1
          fi

          # prerelease 판정 (`-rc.x` / `-beta.x` / `-alpha.x` 포함 여부)
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "✅ VERSION='$VERSION' (prerelease=$PRERELEASE)"

      - name: Check if tag already exists
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Tag $TAG already exists. Skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tag $TAG does not exist. Will create."
          fi

      - name: Extract CHANGELOG section for this version
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            /^## \[/ {
              if ($0 ~ "\\[" ver "\\]") { found = 1; next }
              else if (found) { exit }
            }
            /^---[[:space:]]*$/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > .release-notes.md

          if [ ! -s .release-notes.md ]; then
            echo "⚠️ No CHANGELOG section found for $VERSION. Falling back to commit message."
            echo "Release $VERSION" > .release-notes.md
          fi

          echo "--- Release notes preview ---"
          cat .release-notes.md

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ Pushed tag $TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: .release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}

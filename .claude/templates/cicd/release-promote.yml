  #       run: |
  #         # 예) Kubernetes:
  #         #   kubectl set image deployment/app app=ghcr.io/${{ github.repository }}:latest-prd
  #         #   kubectl rollout status deployment/app
  #         # 예) self-hosted docker compose:
  #         #   docker compose pull && docker compose up -d
  #         echo "TODO: 실서버 배포 명령"
